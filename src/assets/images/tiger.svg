<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="tiger-svg" role="img" aria-labelledby="tiger-title">
  <title id="tiger-title">앉아 있는 주황색 호랑이</title>
  <defs>
    <radialGradient id="fur" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffa53d"/>
      <stop offset="100%" stop-color="#e2721b"/>
    </radialGradient>
    <radialGradient id="iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7d046"/>
      <stop offset="100%" stop-color="#7aa52b"/>
    </radialGradient>
  </defs>

  <!-- 그림자 -->
  <ellipse class="tiger-shadow" cx="200" cy="382" rx="120" ry="12" fill="#000" opacity="0.18"/>

  <!-- 꼬리 (몸 뒤) -->
  <g class="tiger-tail">
    <path d="M270 330 C330 335 350 290 335 250 C325 222 340 200 360 196" fill="none" stroke="#e2721b" stroke-width="20" stroke-linecap="round"/>
    <path d="M300 333 l6 -18 M326 312 l-14 -12 M338 272 l-18 -4 M334 238 l-16 6" stroke="#2b1a0e" stroke-width="7" stroke-linecap="round"/>
    <circle cx="360" cy="196" r="11" fill="#2b1a0e"/>
  </g>

  <!-- 몸통 -->
  <g class="tiger-body">
    <ellipse cx="200" cy="292" rx="98" ry="84" fill="url(#fur)"/>
    <ellipse cx="200" cy="308" rx="54" ry="66" fill="#fff8ec"/>
    <path d="M110 260 q20 6 26 22 M104 292 q22 4 30 20 M114 326 q18 0 28 14" fill="none" stroke="#2b1a0e" stroke-width="8" stroke-linecap="round"/>
    <path d="M290 260 q-20 6 -26 22 M296 292 q-22 4 -30 20 M286 326 q-18 0 -28 14" fill="none" stroke="#2b1a0e" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 앞다리 -->
  <g class="tiger-leg tiger-leg-left">
    <rect x="146" y="296" width="40" height="82" rx="20" fill="url(#fur)"/>
    <path d="M148 322 h14 M148 344 h12" stroke="#2b1a0e" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="166" cy="374" rx="26" ry="13" fill="#fff8ec"/>
    <path d="M158 368 v10 M166 367 v11 M174 368 v10" stroke="#d9b88f" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g class="tiger-leg tiger-leg-right">
    <rect x="214" y="296" width="40" height="82" rx="20" fill="url(#fur)"/>
    <path d="M252 322 h-14 M252 344 h-12" stroke="#2b1a0e" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="234" cy="374" rx="26" ry="13" fill="#fff8ec"/>
    <path d="M226 368 v10 M234 367 v11 M242 368 v10" stroke="#d9b88f" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- 머리 -->
  <g class="tiger-head">
    <g class="tiger-ear tiger-ear-left">
      <circle cx="132" cy="96" r="30" fill="#e2721b"/>
      <circle cx="132" cy="98" r="17" fill="#fff8ec"/>
      <circle cx="132" cy="98" r="9" fill="#2b1a0e" opacity="0.25"/>
    </g>
    <g class="tiger-ear tiger-ear-right">
      <circle cx="268" cy="96" r="30" fill="#e2721b"/>
      <circle cx="268" cy="98" r="17" fill="#fff8ec"/>
      <circle cx="268" cy="98" r="9" fill="#2b1a0e" opacity="0.25"/>
    </g>

    <ellipse cx="200" cy="162" rx="96" ry="82" fill="url(#fur)"/>
    <!-- 볼 털 -->
    <path d="M106 170 l-14 10 l16 4 l-12 12 l22 -2 q10 18 30 22 L150 186 Z" fill="#fff8ec"/>
    <path d="M294 170 l14 10 l-16 4 l12 12 l-22 -2 q-10 18 -30 22 L250 186 Z" fill="#fff8ec"/>

    <!-- 이마 줄무늬 (王) -->
    <path d="M178 96 h44 M182 112 h36 M186 128 h28 M200 92 v38" stroke="#2b1a0e" stroke-width="7" stroke-linecap="round"/>
    <path d="M112 140 q16 2 24 12 M110 160 q14 0 22 8 M288 140 q-16 2 -24 12 M290 160 q-14 0 -22 8" fill="none" stroke="#2b1a0e" stroke-width="7" stroke-linecap="round"/>

    <!-- 눈 -->
    <g class="tiger-eyes">
      <ellipse cx="164" cy="152" rx="17" ry="14" fill="#fff"/>
      <ellipse cx="236" cy="152" rx="17" ry="14" fill="#fff"/>
      <g class="tiger-pupils">
        <circle cx="166" cy="153" r="10" fill="url(#iris)"/>
        <ellipse cx="166" cy="153" rx="3.2" ry="8" fill="#1a1006"/>
        <circle cx="169" cy="149" r="2.5" fill="#fff"/>
        <circle cx="234" cy="153" r="10" fill="url(#iris)"/>
        <ellipse cx="234" cy="153" rx="3.2" ry="8" fill="#1a1006"/>
        <circle cx="237" cy="149" r="2.5" fill="#fff"/>
      </g>
      <!-- 눈꺼풀 (깜빡임) -->
      <g class="tiger-eyelids">
        <ellipse cx="164" cy="152" rx="18" ry="15" fill="#e2721b"/>
        <ellipse cx="236" cy="152" rx="18" ry="15" fill="#e2721b"/>
      </g>
      <path d="M145 140 q19 -10 36 2 M255 140 q-19 -10 -36 2" fill="none" stroke="#2b1a0e" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- 주둥이 -->
    <ellipse cx="180" cy="200" rx="30" ry="24" fill="#fff8ec"/>
    <ellipse cx="220" cy="200" rx="30" ry="24" fill="#fff8ec"/>
    <ellipse cx="200" cy="168" rx="12" ry="22" fill="#fff8ec"/>

    <!-- 포효하는 입 -->
    <g class="tiger-mouth-open">
      <path d="M176 212 q24 46 48 0 Z" fill="#8a1c1c"/>
      <path d="M186 212 l4 10 l4 -10 M206 212 l4 10 l4 -10" fill="#fff"/>
      <ellipse cx="200" cy="232" rx="10" ry="6" fill="#e0607a"/>
    </g>

    <!-- 코와 입선 -->
    <path d="M186 184 h28 l-14 14 Z" fill="#c94f5f" stroke="#2b1a0e" stroke-width="2" stroke-linejoin="round"/>
    <path class="tiger-mouth-closed" d="M200 198 v10 q-10 10 -20 2 M200 208 q10 10 20 2" fill="none" stroke="#2b1a0e" stroke-width="3" stroke-linecap="round"/>

    <!-- 수염 -->
    <g class="tiger-whiskers" stroke="#5a3a1e" stroke-width="2" stroke-linecap="round">
      <path d="M160 200 l-52 -8 M160 208 l-54 4 M162 216 l-48 14"/>
      <path d="M240 200 l52 -8 M240 208 l54 4 M238 216 l48 14"/>
    </g>
    <circle cx="170" cy="198" r="2" fill="#5a3a1e"/>
    <circle cx="176" cy="208" r="2" fill="#5a3a1e"/>
    <circle cx="230" cy="198" r="2" fill="#5a3a1e"/>
    <circle cx="224" cy="208" r="2" fill="#5a3a1e"/>
  </g>
</svg>
